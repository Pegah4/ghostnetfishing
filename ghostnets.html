<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Offene Geisternetze</title>
</head>
<body>

<h1>Offene Geisternetze</h1>

<a href="/">Zur Startseite</a>
<br><br>
<a href="/ghostnets/new">Neues Geisternetz melden</a>

<hr>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Breitengrad</th>
        <th>Längengrad</th>
        <th>Größe</th>
        <th>Status</th>
        <th>Bergende Person</th>
        <th>Aktion</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="ghostNet : ${ghostNets}">
        <td th:text="${ghostNet.id}"></td>
        <td th:text="${ghostNet.latitude}"></td>
        <td th:text="${ghostNet.longitude}"></td>
        <td th:text="${ghostNet.size}"></td>
        <td th:text="${ghostNet.status}"></td>
        <td th:text="${ghostNet.rescuer != null ? ghostNet.rescuer.name : '-'}"></td>
        <td>
            <a th:href="@{/ghostnets/edit/{id}(id=${ghostNet.id})}">Bearbeiten</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
