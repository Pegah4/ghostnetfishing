<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Geisternetz melden</title>
</head>
<body>

<h1>Neues Geisternetz melden</h1>

<a href="/">Zur Startseite</a>
<br><br>
<a href="/ghostnets">Zur Übersicht</a>

<hr>

<form th:action="@{/ghostnets}" th:object="${ghostNet}" method="post">
  <input type="hidden" th:field="*{id}">
  <label>Breitengrad:</label>
  <input type="number" step="any" th:field="*{latitude}" required>
  <br><br>

  <label>Längengrad:</label>
  <input type="number" step="any" th:field="*{longitude}" required>
  <br><br>

  <label>Geschätzte Größe:</label>
  <input type="number" step="any" th:field="*{size}" required>
  <br><br>

  <label>Status:</label>
  <select th:field="*{status}">
    <option value="Gemeldet">Gemeldet</option>
    <option value="Bergung bevorstehend">Bergung bevorstehend</option>
    <option value="Geborgen">Geborgen</option>
    <option value="Verschollen">Verschollen</option>
  </select>
  <br><br>

  <label>Bergende Person:</label>
  <select name="rescuerId">
    <option value="">-- Person auswählen --</option>
    <option th:each="person : ${persons}"
            th:value="${person.id}"
            th:text="${person.name}">
    </option>
  </select>
  <br><br>
  <button type="submit">Geisternetz speichern</button>

</form>

</body>
</html>
