<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Personen</title>
</head>
<body>

<h1>Personen</h1>

<a href="/">Zur Startseite</a>
<br><br>
<a href="/persons/new">Neue Person anlegen</a>

<hr>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Telefonnummer</th>
    <th>Personentyp</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="person : ${persons}">
    <td th:text="${person.id}"></td>
    <td th:text="${person.name}"></td>
    <td th:text="${person.phoneNumber}"></td>
    <td th:text="${person.personType}"></td>
  </tr>
  </tbody>
</table>

</body>
</html>
