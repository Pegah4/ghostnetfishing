<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Person anlegen</title>
</head>
<body>

<h1>Neue Person anlegen</h1>

<a href="/">Zur Startseite</a>
<br><br>
<a href="/persons">Zur Personenübersicht</a>

<hr>

<form th:action="@{/persons}" th:object="${person}" method="post">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>
    <br><br>

    <label>Telefonnummer:</label>
    <input type="text" th:field="*{phoneNumber}" required>
    <br><br>

    <label>Personentyp:</label>
    <select th:field="*{personType}">
        <option value="Meldende Person">Meldende Person</option>
        <option value="Bergende Person">Bergende Person</option>
    </select>

    <br><br>
    <button type="submit">Person speichern</button>

</form>

</body>
</html>
